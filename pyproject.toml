[project]
name = "checklist-bot"
dynamic = ["version"]
description = "Telegram-бот для задач в общем чате: задачи по сменам, отметка выполнения ответом"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "aiogram>=3.20,<4",
    "tzdata>=2024.1",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "src/checklist_bot/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/checklist_bot"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
