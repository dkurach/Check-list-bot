name: Release check

on:
  release:
    types: [published]

jobs:
  version:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Tag matches __version__
        run: |
          version=$(python3 -c "import re;print(re.search(r'__version__ = \"(.+)\"', open('src/checklist_bot/__init__.py').read()).group(1))")
          if [ "${GITHUB_REF_NAME#v}" != "$version" ]; then
            echo "::error::Тег релиза ${GITHUB_REF_NAME} не совпадает с __version__ = $version"
            exit 1
          fi
